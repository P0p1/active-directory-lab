# Active Directory Lab Configuration
# Centralized configuration file for all deployment scripts
# Store this securely and exclude from version control (.gitignore)

[Network]
StaticIP = '192.168.83.10'
PrefixLength = 24
Gateway = '192.168.83.2'
DNS = '127.0.0.1'
ComputerName = 'Server01'

[ActiveDirectory]
Domain = 'ecorp.co.za'
NetBIOSName = 'ECORP'
# DSRM password should be entered interactively, not stored here

[OrganizationalUnits]
BaseOU = 'DC=ecorp,DC=co,DC=za'
OUs = 'OU=Finance', 'OU=Groups', 'OU=Computers', 'OU=Servers', 'OU=Workstations'

[Users]
UserOU = 'OU=Finance,DC=ecorp,DC=co,DC=za'
# User credentials should be managed via secure input or external secrets manager
